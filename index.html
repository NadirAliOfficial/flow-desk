<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div id="loading-screen" style="position:fixed;inset:0;background:#0d0d0f;display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:12px">
  <div style="font-size:22px;font-weight:700;color:#c9a227;letter-spacing:2px">FLOWDESK</div>
  <div style="width:40px;height:2px;background:#c9a227;animation:ld 1s ease-in-out infinite alternate;transform-origin:left"></div>
  <style>@keyframes ld{from{transform:scaleX(0.2)}to{transform:scaleX(1)}}</style>
</div>
<div class="app">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <!-- Stock Info Card -->
      <div class="stock-card">
        <!-- Header row: ticker + time -->
        <div class="sc-header">
          <span class="stock-ticker" id="selected-ticker">ENVB</span>
          <span class="sc-time" id="selected-time">07:33</span>
        </div>

        <!-- Price row -->
        <div class="sc-price-row">
          <span class="stock-price" id="selected-price">$4.21</span>
          <span class="sc-pricelevel" id="selected-pricelevel">&lt; $5</span>
          <span class="stock-pct positive" id="selected-pct">+147%</span>
        </div>

        <!-- Flags row -->
        <div class="sc-flags" id="selected-flags">
          <span class="flag flag-nhod">NHOD</span>
        </div>

        <!-- Data grid -->
        <div class="sc-grid">
          <div class="sc-cell">
            <span class="sc-label">Float</span>
            <span class="sc-val" id="selected-float">1.5M</span>
          </div>
          <div class="sc-cell">
            <span class="sc-label">RVol</span>
            <span class="sc-val highlight" id="selected-rvol">4,100x</span>
          </div>
          <div class="sc-cell">
            <span class="sc-label">Vol</span>
            <span class="sc-val" id="selected-vol">14.1M</span>
          </div>
          <div class="sc-cell">
            <span class="sc-label">IO</span>
            <span class="sc-val" id="selected-io">2.1%</span>
          </div>
          <div class="sc-cell">
            <span class="sc-label">MC</span>
            <span class="sc-val" id="selected-mc">6.3M</span>
          </div>
          <div class="sc-cell">
            <span class="sc-label">SI</span>
            <span class="sc-val" id="selected-si">8.4%</span>
          </div>
        </div>

        <!-- Theme -->
        <div class="sc-theme-row">
          <span class="sc-label">Theme</span>
          <span class="sc-theme-badge" id="selected-theme">Psychedelic</span>
        </div>
      </div>

      <!-- Watchlist / Latest Alerts -->
      <div class="watchlist-card">
        <div class="watchlist-header">
          <span class="watchlist-title">Latest Alerts</span>
          <div class="watchlist-actions">
            <button class="icon-btn" title="Refresh" onclick="refreshWatchlist()">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M12 7A5 5 0 1 1 7 2a5 5 0 0 1 3.54 1.46L12 2v4H8l1.76-1.76A3 3 0 1 0 10 7" stroke="#aaa" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div class="watchlist-items" id="watchlist-items">
          <!-- Populated by JS -->
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <!-- Chart Header -->
      <div class="chart-card">
        <div class="chart-header">
          <div class="chart-title-row">
            <span class="chart-ticker" id="chart-ticker">AAPL</span>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="#aaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="chart-controls">
            <button class="icon-btn sound-btn" id="sound-toggle" title="Enable Sound" onclick="initAudio()">
              <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 5.5h2.5L8 2v11L4.5 9.5H2a.5.5 0 0 1-.5-.5v-3A.5.5 0 0 1 2 5.5Z" stroke="#aaa" stroke-width="1.2" stroke-linejoin="round"/><path d="M10.5 4.5a4 4 0 0 1 0 6M12.5 2.5a7 7 0 0 1 0 10" stroke="#aaa" stroke-width="1.2" stroke-linecap="round" id="sound-waves"/></svg>
            </button>
          </div>
        </div>

        <div class="timeframe-bar">
          <button class="tf-btn" data-tf="1D">1D</button>
          <button class="tf-btn" data-tf="5D">5D</button>
          <button class="tf-btn active" data-tf="1M">1M</button>
          <button class="tf-btn" data-tf="3M">3M</button>
          <button class="tf-btn" data-tf="6M">6M</button>
          <button class="tf-btn" data-tf="1Y">1Y</button>
          <button class="tf-btn" data-tf="5Y">5Y</button>
          <button class="tf-btn" data-tf="ALL">All</button>
        </div>

        <div id="main-chart" class="chart-container"></div>
      </div>

      <!-- TradingView Chart -->
      <div class="chart-card tradingview-card">
        <div class="chart-header">
          <div class="chart-title-row">
            <span class="tv-dot"></span>
            <span class="chart-label">TradingView Chart</span>
          </div>
          <div class="chart-controls"></div>
        </div>
        <div id="volume-chart" class="chart-container volume-chart-container"></div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
